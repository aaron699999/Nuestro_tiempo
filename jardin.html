<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Nuestro Jardín 🌷</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Nunito:wght@400;600;700;800;900&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{margin:0;min-height:100vh;background:#0a0308;color:#fff;font-family:'Nunito',sans-serif;overflow-x:hidden;}

*{box-sizing:border-box;}
body{
  margin:0;min-height:100vh;
  background:#1A0B2E;
  color:#fff;
  font-family:'Inter',sans-serif;
  overflow-x:hidden;
}


/* ══ AURORA ══ */
.aurora{
  position:fixed;inset:0;z-index:0;
  background:
    radial-gradient(circle at 20% 30%,#FF2E87 0%,transparent 45%),
    radial-gradient(circle at 80% 20%,#7B2FF7 0%,transparent 45%),
    radial-gradient(circle at 50% 85%,#FF6B35 0%,transparent 45%),
    radial-gradient(circle at 5% 90%,#FFD23F 0%,transparent 40%);
  filter:blur(80px) saturate(150%);
  opacity:0.55;
  animation:auroraMove 28s ease-in-out infinite alternate;
}
@keyframes auroraMove{
  0%{transform:scale(1) rotate(0deg);}
  50%{transform:scale(1.15) rotate(8deg);}
  100%{transform:scale(1) rotate(-6deg);}
}
.heart-float{
  position:fixed;bottom:-10%;font-size:1.1rem;
  opacity:0.45;pointer-events:none;
  animation:floatUp linear infinite;z-index:0;
}
@keyframes floatUp{
  0%{transform:translateY(0) translateX(0);opacity:0;}
  10%{opacity:0.45;}90%{opacity:0.3;}
  100%{transform:translateY(-115vh) translateX(20px);opacity:0;}
}

/* ══ LOGIN ══ */
#loginScreen{
  position:fixed;inset:0;z-index:900;
  display:flex;align-items:center;justify-content:center;
  transition:opacity 0.6s ease;
}
#loginScreen.out{opacity:0;pointer-events:none;}
.login-card{
  position:relative;z-index:1;
  background:rgba(255,255,255,0.06);
  backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,0.14);
  border-radius:24px;
  padding:2.5rem 2rem;
  width:90%;max-width:380px;
  text-align:center;
  box-shadow:0 20px 60px rgba(0,0,0,0.35);
}
.login-card h1{
  font-family:'Fredoka',sans-serif;font-weight:700;
  font-size:clamp(1.4rem,5vw,1.9rem);margin:0 0 0.4rem;
  color:#fff;
}
.login-card p.sub{margin:0 0 1.8rem;opacity:0.75;font-size:0.92rem;color:#fff;}
.login-card label{
  display:block;text-align:left;font-size:0.78rem;
  letter-spacing:0.5px;text-transform:uppercase;opacity:0.7;
  margin:0 0 0.35rem;color:#fff;
}
.login-card input{
  width:100%;padding:0.85rem 1rem;margin-bottom:1.1rem;
  border-radius:12px;border:1px solid rgba(255,255,255,0.18);
  background:rgba(255,255,255,0.08);color:#fff;
  font-family:'Inter',sans-serif;font-size:1rem;
}
.login-card input::placeholder{color:rgba(255,255,255,0.4);}
.login-card button{
  width:100%;padding:0.95rem;border:none;border-radius:14px;
  background:linear-gradient(135deg,#FF2E87,#7B2FF7);
  color:#fff;font-family:'Inter',sans-serif;font-weight:700;
  font-size:1rem;cursor:pointer;transition:transform 0.15s ease;
}
.login-card button:hover{transform:scale(1.02);}
.login-card button:active{transform:scale(0.97);}
.login-error{color:#FFD23F;font-size:0.85rem;margin-top:0.9rem;min-height:1.2em;}

/* ══ CONTADOR ══ */
#contadorScreen{
  position:fixed;inset:0;z-index:800;
  display:none;flex-direction:column;
  align-items:center;justify-content:center;
  padding:1.5rem;overflow-y:auto;
  text-align:center;
}
#contadorScreen.visible{display:flex;}
#contadorScreen h1{
  font-family:'Fredoka',sans-serif;font-weight:700;
  font-size:clamp(1.8rem,6vw,2.8rem);
  margin:0 0 2.2rem;
  background:linear-gradient(90deg,#FF2E87,#FF6B35,#FFD23F,#7B2FF7,#FF2E87);
  background-size:300% auto;
  -webkit-background-clip:text;background-clip:text;color:transparent;
  animation:gradientShift 9s linear infinite;
}
@keyframes gradientShift{
  0%{background-position:0% 50%;}100%{background-position:300% 50%;}
}
.digits{
  display:flex;gap:clamp(0.6rem,3vw,2rem);
  justify-content:center;flex-wrap:wrap;
}
.unit{display:flex;flex-direction:column;align-items:center;min-width:70px;}
.unit .value{
  font-family:'DM Mono',monospace;font-weight:500;
  font-size:clamp(2rem,9vw,4rem);line-height:1;
}
.unit.dias .value{color:#FF2E87;text-shadow:0 0 25px rgba(255,46,135,0.55);}
.unit.horas .value{color:#FF6B35;text-shadow:0 0 25px rgba(255,107,53,0.55);}
.unit.min .value{color:#7B2FF7;text-shadow:0 0 25px rgba(123,47,247,0.6);}
.unit.seg .value{color:#FFD23F;text-shadow:0 0 25px rgba(255,210,63,0.55);}
.unit .label{
  font-family:'Inter',sans-serif;font-size:0.7rem;
  letter-spacing:2px;text-transform:uppercase;opacity:0.65;margin-top:0.5rem;color:#fff;
}
.desde-txt{margin-top:2.2rem;font-size:0.92rem;opacity:0.75;color:#fff;}
.dedicatoria{
  font-family:'Inter',sans-serif;font-size:clamp(0.95rem,3.5vw,1.1rem);
  line-height:1.8;color:rgba(255,255,255,0.88);
  text-align:center;margin:2rem 0 1.5rem;font-style:italic;
}
.gracias{
  font-family:'Fredoka',sans-serif;font-size:clamp(1.1rem,4vw,1.35rem);
  font-style:normal;font-weight:700;
  background:linear-gradient(90deg,#FF2E87,#FF6B35);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.cancion-wrap{max-width:360px;width:90%;margin:0 auto;}
.btn-regalito{
  display:block;width:90%;max-width:340px;
  margin:2rem auto 0;
  padding:1rem;border:none;border-radius:16px;
  background:linear-gradient(135deg,#FF2E87,#7B2FF7);
  color:#fff;font-family:'Fredoka',sans-serif;font-weight:700;
  font-size:1.1rem;letter-spacing:0.2em;cursor:pointer;
  text-transform:uppercase;
  box-shadow:0 4px 24px rgba(255,46,135,0.45);
  transition:transform 0.15s,box-shadow 0.15s;
}
.btn-regalito:hover{transform:scale(1.03);}
.btn-regalito:active{transform:scale(0.96);}




@import url('https://fonts.googleapis.com/css2?family=Pacifico&family=Nunito:wght@400;600;700;800;900&family=Cormorant+Garamond:ital,wght@1,400;1,500&display=swap');

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden}

:root{
  --bg:#04090f;
  --sky:#b8e8ff;
  --sky2:#d6f1ff;
  --sky3:#e8f8ff;
  --white:#f5faff;
  --gold:#f5d76e;
  --pink:#ffb3d9;
  --text:#e8f4ff;
  --card:rgba(180,230,255,0.05);
  --border:rgba(180,230,255,0.18);
  --border2:rgba(180,230,255,0.1);
}

body{
  background:var(--bg);
  font-family:'Nunito',sans-serif;
  color:var(--text);
  min-height:100vh;
  display:flex;flex-direction:column;align-items:center;
}
canvas#bg{position:fixed;inset:0;z-index:0;pointer-events:none}

#app{
  position:relative;z-index:10;
  display:none;
  width:100%;max-width:520px;
  padding:24px 16px 80px;
  overflow-y:auto;height:100vh;
}
#app::-webkit-scrollbar{display:none}

/* ── HEADER ── */
.header{text-align:center;padding:30px 0 22px;animation:fadeDown 0.8s ease both}
.header-sub{
  font-family:'Cormorant Garamond',serif;font-style:italic;
  font-size:0.95rem;color:rgba(180,230,255,0.55);letter-spacing:0.18em;margin-bottom:8px;
}
.header-title{
  font-family:'Pacifico',cursive;
  font-size:clamp(1.9rem,7vw,2.8rem);
  background:linear-gradient(135deg,#ffffff,#b8e8ff,#7dd3fc,#f0abfc);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 0 22px rgba(120,200,255,0.45));
  line-height:1.2;
}
.score-bar{
  display:flex;align-items:center;justify-content:center;gap:8px;
  margin-top:14px;font-size:0.82rem;letter-spacing:0.12em;
  color:rgba(180,230,255,0.45);
}
.score-val{color:var(--gold);font-weight:900;font-size:1.05rem;
  text-shadow:0 0 12px rgba(245,215,110,0.5)}

/* ── SECCIÓN ── */
.section{
  background:var(--card);
  border:1.5px solid var(--border);
  border-radius:26px;padding:22px 18px;margin-bottom:20px;
  backdrop-filter:blur(18px);
  box-shadow:0 8px 40px rgba(0,0,0,0.4),0 0 0 1px rgba(180,230,255,0.04);
  animation:fadeUp 0.6s ease both;
}
.section-title{
  font-family:'Pacifico',cursive;font-size:1.15rem;
  margin-bottom:4px;display:flex;align-items:center;gap:8px;
  color:var(--white);
}
.section-sub{
  font-size:0.72rem;color:rgba(180,230,255,0.38);
  letter-spacing:0.14em;text-transform:uppercase;margin-bottom:16px;
}

/* ════════════════════════════
   JUEGO 1 — MEMORIA
════════════════════════════ */
#memGrid{
  display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:4px;
}
.mem-card{
  aspect-ratio:1;border-radius:13px;cursor:pointer;
  position:relative;transform-style:preserve-3d;
  transition:transform 0.45s ease;user-select:none;
}
.mem-card.flipped{transform:rotateY(180deg)}
.mem-card.matched{cursor:default}
.mem-front,.mem-back{
  position:absolute;inset:0;border-radius:13px;
  display:flex;align-items:center;justify-content:center;
  backface-visibility:hidden;
}
.mem-front{
  background:linear-gradient(135deg,#071828,#0a2035);
  border:1.5px solid rgba(100,180,255,0.22);
  font-size:1.1rem;color:rgba(120,190,255,0.35);
}
.mem-back{
  background:linear-gradient(135deg,#0e3352,#1a5276);
  border:1.5px solid rgba(140,210,255,0.4);
  transform:rotateY(180deg);
  font-size:clamp(1.3rem,5vw,1.9rem);
  box-shadow:0 4px 16px rgba(80,170,255,0.25);
}
.mem-card.matched .mem-back{
  background:linear-gradient(135deg,#0a2a2a,#0e4040);
  border-color:rgba(100,230,210,0.55);
  box-shadow:0 4px 18px rgba(50,210,190,0.35);
}
.mem-status{
  text-align:center;margin-top:12px;font-size:0.85rem;
  color:rgba(180,230,255,0.55);min-height:1.4em;
}
.mem-btn{
  display:block;width:100%;margin-top:12px;padding:10px;
  border-radius:13px;border:none;
  background:linear-gradient(135deg,#1a6a9a,#2196c4);
  color:#fff;font-family:'Nunito',sans-serif;font-weight:800;
  font-size:0.9rem;cursor:pointer;
  box-shadow:0 4px 18px rgba(30,140,200,0.4);
  transition:transform 0.12s,box-shadow 0.12s;
}
.mem-btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(30,140,200,0.6)}
.mem-btn:active{transform:scale(0.96)}

/* ════════════════════════════
   JUEGO 2 — ADIVINA
════════════════════════════ */
.word-counter{
  text-align:center;font-size:0.72rem;
  color:rgba(180,230,255,0.38);margin-bottom:8px;letter-spacing:0.12em;text-transform:uppercase;
}
.word-pista{
  background:rgba(100,190,255,0.06);
  border:1px solid rgba(140,210,255,0.2);
  border-radius:13px;padding:14px 16px;
  font-family:'Cormorant Garamond',serif;font-style:italic;
  font-size:1.12rem;color:rgba(210,240,255,0.88);
  margin-bottom:14px;line-height:1.55;min-height:58px;
}
.word-blanks{
  display:flex;justify-content:center;flex-wrap:wrap;gap:6px;margin-bottom:14px;
}
.letter-box{
  width:clamp(26px,7vw,38px);height:clamp(34px,9vw,48px);
  border-bottom:2.5px solid rgba(140,210,255,0.5);
  display:flex;align-items:flex-end;justify-content:center;
  font-size:clamp(0.95rem,4vw,1.3rem);font-weight:900;
  color:var(--white);padding-bottom:4px;
  transition:border-color 0.3s,color 0.3s;
}
.letter-box.correct{border-color:#67e8f9;color:#67e8f9}
.letter-box.wrong-flash{border-color:#fda4af;animation:shake 0.3s ease}
.word-vidas{
  font-size:0.85rem;color:rgba(180,230,255,0.5);
  text-align:center;margin-bottom:10px;letter-spacing:0.05em;
}
.word-keyboard{
  display:flex;flex-wrap:wrap;justify-content:center;gap:5px;margin-bottom:10px;
}
.key-btn{
  width:clamp(27px,7.5vw,37px);height:clamp(30px,8vw,40px);
  border-radius:8px;border:1px solid rgba(120,200,255,0.25);
  background:rgba(60,140,200,0.14);
  color:var(--text);font-weight:800;font-size:0.8rem;cursor:pointer;
  transition:all 0.15s;display:flex;align-items:center;justify-content:center;
}
.key-btn:hover{background:rgba(100,190,255,0.3);border-color:rgba(160,220,255,0.5)}
.key-btn:active{transform:scale(0.88)}
.key-btn:disabled{opacity:0.18;cursor:default;pointer-events:none}
.word-msg{text-align:center;min-height:1.5em;font-weight:800;font-size:0.9rem;margin-top:4px}
.word-next{
  display:none;width:100%;margin-top:10px;padding:10px;
  border-radius:13px;border:none;
  background:linear-gradient(135deg,#0e6ea0,#38bdf8);
  color:#fff;font-family:'Nunito',sans-serif;font-weight:800;
  font-size:0.88rem;cursor:pointer;
  box-shadow:0 4px 16px rgba(30,160,220,0.4);transition:transform 0.12s;
}
.word-next:hover{transform:translateY(-2px)}
.word-done-msg{
  text-align:center;padding:16px 8px;
  font-family:'Pacifico',cursive;font-size:1.05rem;
  color:var(--sky);line-height:1.65;display:none;
}

/* ════════════════════════════
   JUEGO 3 — AFIRMACIONES
════════════════════════════ */
.aff-intro{
  font-family:'Cormorant Garamond',serif;font-style:italic;
  font-size:1.05rem;color:rgba(200,235,255,0.65);
  text-align:center;margin-bottom:18px;line-height:1.55;
}
.aff-progress{
  display:flex;gap:6px;justify-content:center;margin-bottom:16px;
}
.a-dot{
  width:8px;height:8px;border-radius:50%;
  background:rgba(140,210,255,0.18);transition:background 0.3s;
}
.a-dot.done{background:var(--gold)}
.a-dot.active{background:var(--sky);box-shadow:0 0 7px rgba(140,210,255,0.7)}

.aff-question{
  font-weight:900;font-size:1.05rem;
  text-align:center;margin-bottom:16px;
  color:rgba(230,248,255,0.95);line-height:1.4;min-height:1.5em;
}
.aff-opts{display:flex;flex-direction:column;gap:9px;margin-bottom:14px}
.aff-opt{
  padding:13px 16px;border-radius:15px;
  border:1.5px solid rgba(140,210,255,0.2);
  background:rgba(60,140,200,0.09);
  font-weight:700;font-size:0.92rem;cursor:pointer;
  text-align:left;transition:all 0.18s;color:var(--text);
  display:flex;align-items:center;gap:10px;
}
.aff-opt:hover{
  background:rgba(100,195,255,0.18);
  border-color:rgba(160,225,255,0.42);
  transform:translateX(5px);
}
.aff-opt:active{transform:scale(0.97)}
.aff-opt[disabled]{pointer-events:none;opacity:0.5}
.aff-opt.selected{
  background:rgba(100,195,255,0.22);
  border-color:rgba(180,230,255,0.55);
}

/* carta revelada */
.aff-card{
  display:none;
  background:linear-gradient(135deg,rgba(10,50,80,0.6),rgba(5,25,45,0.7));
  border:1.5px solid rgba(140,215,255,0.28);
  border-radius:20px;padding:22px 18px;
  text-align:center;margin-bottom:14px;
  animation:affPop 0.65s cubic-bezier(0.34,1.56,0.64,1) both;
}
.aff-card.show{display:block}
.aff-emoji{
  font-size:2.6rem;margin-bottom:12px;display:block;
  animation:floatY 3.2s ease-in-out infinite;
}
.aff-text{
  font-family:'Cormorant Garamond',serif;font-style:italic;
  font-size:1.18rem;line-height:1.65;
  color:rgba(230,248,255,0.95);
  text-shadow:0 0 18px rgba(100,200,255,0.2);
}
.aff-from{
  margin-top:12px;font-size:0.76rem;letter-spacing:0.22em;
  color:rgba(160,220,255,0.4);text-transform:uppercase;
}

.aff-next{
  display:none;width:100%;padding:10px;border-radius:13px;border:none;
  background:linear-gradient(135deg,#0c5a8a,#0ea5e9);
  color:#fff;font-family:'Nunito',sans-serif;font-weight:800;
  font-size:0.88rem;cursor:pointer;
  box-shadow:0 4px 16px rgba(14,165,233,0.4);transition:transform 0.12s;
  margin-bottom:4px;
}
.aff-next:hover{transform:translateY(-2px)}
.aff-next.show{display:block}

.aff-restart{
  display:none;width:100%;padding:10px;border-radius:13px;border:none;
  background:linear-gradient(135deg,#1a3a4a,#2a5a7a);
  color:rgba(180,230,255,0.8);font-family:'Nunito',sans-serif;font-weight:700;
  font-size:0.82rem;cursor:pointer;border:1px solid rgba(140,210,255,0.2);
  transition:all 0.2s;margin-top:6px;
}
.aff-restart:hover{background:linear-gradient(135deg,#1e4a5e,#2e6a8e);color:#fff}
.aff-restart.show{display:block}

/* ── FX ── */
.spark{position:fixed;pointer-events:none;z-index:80;border-radius:50%;animation:sparkFly ease-out forwards}
.confetti-p{position:fixed;pointer-events:none;z-index:79;animation:confFall linear forwards}
.toast{
  position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(90px);
  z-index:90;background:rgba(4,14,28,0.96);
  border:1.5px solid rgba(140,210,255,0.22);border-radius:20px;
  padding:14px 22px;font-family:'Nunito',sans-serif;font-weight:700;font-size:0.92rem;
  color:var(--white);text-align:center;backdrop-filter:blur(20px);
  box-shadow:0 8px 32px rgba(0,0,0,0.55);
  transition:transform 0.5s cubic-bezier(0.34,1.56,0.64,1),opacity 0.5s;
  opacity:0;pointer-events:none;max-width:290px;line-height:1.5;
}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}

/* ── KEYFRAMES ── */
@keyframes fadeDown{from{opacity:0;transform:translateY(-18px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes sparkFly{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--tx),var(--ty)) scale(0)}}
@keyframes confFall{0%{transform:translateY(-30px) rotate(0deg);opacity:1}80%{opacity:0.8}100%{transform:translateY(105vh) rotate(var(--rot));opacity:0}}
@keyframes affPop{from{opacity:0;transform:scale(0.82) translateY(18px)}to{opacity:1;transform:scale(1) translateY(0)}}
@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}


  50%{box-shadow:0 4px 32px rgba(20,140,210,0.85),0 0 0 8px rgba(20,140,210,0.1)}
}


}

}


}



/* ══ APERTURA ══ */
#apertura{
  position:fixed;inset:0;z-index:1000;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
}
#papel{
  position:absolute;inset:0;
  background:linear-gradient(160deg,#f5f0e8 0%,#ede5d0 40%,#e8dfc8 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  overflow:hidden;
}
#papel::before{
  content:'';position:absolute;inset:0;
  background-image:repeating-linear-gradient(0deg,transparent,transparent 32px,rgba(0,0,0,0.04) 32px,rgba(0,0,0,0.04) 33px);
  pointer-events:none;
}
#papel::after{content:'';position:absolute;inset:16px;border:1.5px solid rgba(160,120,60,0.2);border-radius:4px;pointer-events:none;}
#fraseUnica{
  position:absolute;top:10%;left:50%;transform:translateX(-50%);
  font-family:'Cormorant Garamond',serif;font-style:italic;
  color:rgba(80,45,15,0.7);font-size:clamp(1rem,3.5vw,1.35rem);
  letter-spacing:0.04em;line-height:1.6;text-align:center;
  max-width:78%;pointer-events:none;
}
.carta-centro{position:relative;z-index:5;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;}
.carta-para{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:0.8rem;color:rgba(100,65,25,0.55);letter-spacing:0.2em;text-transform:uppercase;}
.carta-nombre{font-family:'Pacifico',cursive;font-size:clamp(2rem,8vw,3rem);color:#5a3010;text-shadow:1px 2px 0 rgba(255,255,255,0.6);margin-bottom:16px;}
.lacre{

/* ══ DEDICATORIA ══ */

.ded-titulo{font-family:'Pacifico',cursive;font-size:clamp(1.6rem,6vw,2.4rem);background:linear-gradient(135deg,#ffffff,#b8e8ff,#7dd3fc);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-align:center;margin-bottom:4px;animation:fadeUp 0.6s ease 0.35s both;}

.ded-letra{background:rgba(180,230,255,0.04);border:1px solid rgba(180,230,255,0.12);border-radius:20px;padding:22px 20px;max-width:340px;width:100%;margin-bottom:20px;animation:fadeUp 0.6s ease 0.65s both;}

.ded-mensaje{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:0.92rem;color:rgba(180,210,255,0.55);text-align:center;max-width:300px;line-height:1.6;margin-bottom:8px;animation:fadeUp 0.6s ease 1.8s both;}
.ded-from{font-size:0.75rem;letter-spacing:0.2em;color:rgba(140,200,255,0.35);text-transform:uppercase;margin-bottom:24px;animation:fadeUp 0.6s ease 2s both;}
.spotify-btn{display:flex;align-items:center;gap:10px;padding:13px 28px;border-radius:999px;border:none;background:#1DB954;color:#fff;font-family:'Nunito',sans-serif;font-weight:800;font-size:0.92rem;cursor:pointer;text-decoration:none;box-shadow:0 4px 20px rgba(29,185,84,0.45);transition:transform 0.15s;animation:fadeUp 0.6s ease 2.2s both;margin-bottom:16px;}
.spotify-btn:active{transform:scale(0.96)}
.ded-skip{font-family:'Nunito',sans-serif;font-weight:800;font-size:0.95rem;color:rgba(180,230,255,0.7);cursor:pointer;letter-spacing:0.15em;text-transform:uppercase;transition:all 0.2s;animation:fadeUp 0.6s ease 2.4s both;background:rgba(140,210,255,0.08);border:1.5px solid rgba(140,210,255,0.25);border-radius:14px;padding:12px 28px;}

/* ══ BOTÓN MÚSICA ══ */
#mBtn{position:fixed;bottom:22px;right:18px;z-index:999;width:46px;height:46px;border-radius:50%;border:none;background:linear-gradient(135deg,#0a3a5a,#1a7aaa);color:#fff;font-size:1.25rem;cursor:pointer;box-shadow:0 4px 18px rgba(20,120,200,0.6);transition:background 0.3s,transform 0.15s;}

/* ══ SKIP WORD ══ */
.word-skip{margin-top:10px;padding:10px 14px;border-radius:12px;border:1px solid rgba(140,210,255,0.2);background:rgba(140,210,255,0.07);color:rgba(180,230,255,0.5);font-family:'Nunito',sans-serif;font-weight:700;font-size:0.82rem;cursor:pointer;transition:all 0.2s;display:none;}

/* ══ CAJITA SORPRESA ══ */
#cajitaBtn{position:fixed;bottom:80px;right:18px;z-index:999;display:none;flex-direction:column;align-items:center;gap:4px;cursor:pointer;animation:cajitaAppear 0.6s cubic-bezier(0.34,1.56,0.64,1) both;}

@keyframes cajitaAppear{from{opacity:0;transform:scale(0) translateY(20px)}to{opacity:1;transform:scale(1) translateY(0)}}
@keyframes cajitaWiggle{0%,100%{transform:rotate(-8deg) scale(1)}25%{transform:rotate(8deg) scale(1.1)}50%{transform:rotate(-5deg) scale(1.05)}75%{transform:rotate(6deg) scale(1.08)}}
/* ══ PANTALLA CARTA ══ */
#cartaSecreta{position:fixed;inset:0;z-index:800;display:none;flex-direction:column;align-items:center;background:linear-gradient(160deg,#07030f 0%,#0d0520 50%,#07030f 100%);overflow-y:auto;opacity:0;transition:opacity 0.6s ease;padding:0 0 40px 0;}
#cartaSecreta.show{display:flex;}#cartaSecreta.visible{opacity:1;}
.cs-header{width:100%;display:flex;align-items:center;padding:16px 20px 8px;position:sticky;top:0;z-index:10;background:linear-gradient(to bottom,#07030f 80%,transparent);}
.cs-back{font-family:'Nunito',sans-serif;font-weight:700;font-size:0.8rem;letter-spacing:0.12em;color:rgba(180,230,255,0.45);background:none;border:none;cursor:pointer;display:flex;align-items:center;gap:6px;transition:color 0.2s;padding:8px 0;}

.cs-estrella{font-size:3rem;margin-bottom:8px;animation:starSpin 0.8s ease both;}
.cs-titulo{font-family:'Pacifico',cursive;font-size:clamp(1.1rem,4vw,1.6rem);color:var(--gold);text-shadow:0 0 20px rgba(245,200,70,0.5);margin-bottom:20px;text-align:center;animation:fadeUp 0.6s ease 0.3s both;line-height:1.3;}
.cs-carta{background:linear-gradient(160deg,#f5f0e8,#ede5d0);border-radius:16px;padding:28px 22px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,0.6);position:relative;overflow:hidden;animation:fadeUp 0.7s ease 0.5s both;}
.cs-carta::before{content:'';position:absolute;inset:0;background-image:repeating-linear-gradient(0deg,transparent,transparent 28px,rgba(0,0,0,0.035) 28px,rgba(0,0,0,0.035) 29px);pointer-events:none;}
.cs-texto{font-family:'Cormorant Garamond',serif;font-size:clamp(0.95rem,2.8vw,1.08rem);color:#3a2010;line-height:1.8;position:relative;z-index:1;white-space:pre-line;}
.cs-firma{font-family:'Pacifico',cursive;font-size:1.05rem;color:#5a3010;margin-top:18px;text-align:right;position:relative;z-index:1;}
.cs-amor{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1.05rem;color:#8a2020;margin-top:6px;text-align:right;position:relative;z-index:1;}
.word-skip{margin-top:10px;padding:10px 14px;border-radius:12px;border:1px solid rgba(140,210,255,0.2);background:rgba(140,210,255,0.07);color:rgba(180,230,255,0.5);font-family:'Nunito',sans-serif;font-weight:700;font-size:0.82rem;cursor:pointer;transition:all 0.2s;display:none;}
.word-skip:hover{background:rgba(140,210,255,0.18);color:rgba(200,240,255,0.9)}
@keyframes starSpin{0%{transform:scale(0) rotate(-180deg);opacity:0}60%{transform:scale(1.3) rotate(10deg)}100%{transform:scale(1) rotate(0deg);opacity:1}}


/* ══ BOTÓN IR A REGALITO 3 ══ */
.btn-pax{
  display:block;width:100%;max-width:300px;
  margin:16px auto 0;
  padding:14px 20px;border-radius:16px;border:none;

  font-size:0.88rem;letter-spacing:0.15em;cursor:pointer;

}
.btn-pax:hover{transform:scale(1.03);box-shadow:0 6px 28px rgba(20,100,180,0.7)}

/* ══ PUNTOS FLOTANTES ══ */
.pts-float{
  position:fixed;
  font-family:'Nunito',sans-serif;font-weight:900;

}

/* ══ FONDO SOL ══ */
#bgSol{position:fixed;inset:0;z-index:0;pointer-events:none;display:none}

#btnVolverSol{

/* ══ SECCIONES SOL ══ */

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#04090f}
:root{--gold:#f5d76e;--sky:#b8e8ff;--bg:#04090f}
body{font-family:'Cormorant Garamond',serif;color:#e8f4ff}
canvas#bg{position:fixed;inset:0;z-index:0;pointer-events:none}

#cargaScreen{
  position:fixed;inset:0;z-index:1000;
  background:#000a02;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:32px 24px;
  font-family:'Courier New',monospace;
  transition:opacity 0.8s ease;
}

.c-lbl{color:rgba(0,255,136,0.45);letter-spacing:0.15em}

.sec{position:fixed;inset:0;z-index:10;display:none;flex-direction:column;align-items:center;justify-content:center;overflow-y:auto;padding:40px 24px 70px}
.sec.activa{display:flex}

.btn-sig{

}

#s2 .inner{max-width:380px;width:100%;display:flex;flex-direction:column;align-items:center}
.enf-titulo{font-family:'Pacifico',cursive;font-size:clamp(1.4rem,5vw,2rem);color:#fff;text-shadow:0 0 20px rgba(200,230,255,0.4);margin-bottom:4px;animation:fadeUp 0.6s ease both}

.ojo-glow{position:absolute;inset:-20px;background:radial-gradient(ellipse,rgba(180,120,40,0.2) 0%,transparent 70%);border-radius:50%;animation:glowPulse 3s ease-in-out infinite alternate}
.ojo-svg{width:100%;height:100%}
.ojo-frase{font-style:italic;font-size:clamp(1.1rem,4vw,1.45rem);color:#fff;line-height:1.75;max-width:320px;text-shadow:0 0 20px rgba(180,230,255,0.35);animation:fadeUp 0.8s ease 0.4s both}
.pedacito-sol{color:#ffd84d;font-weight:400;display:inline-block;position:relative;animation:solPulse 1.8s ease-in-out infinite;text-shadow:0 0 8px rgba(255,220,50,0.9),0 0 20px rgba(255,200,30,0.7),0 0 40px rgba(255,180,0,0.5),0 0 60px rgba(255,160,0,0.3)}
.pedacito-sol::after{content:'';position:absolute;bottom:-3px;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,#ffd84d,#ffaa00,#ffd84d,transparent);border-radius:2px;animation:subrayado 2s ease-in-out infinite}
.ojo-sol{display:inline-block;animation:solSpin 4s linear infinite;filter:drop-shadow(0 0 8px rgba(245,215,70,0.8))}
.frases-wrap{width:100%;max-width:340px;display:flex;flex-direction:column;gap:12px;margin-top:4px}
.frase-card{position:relative;border-radius:14px;overflow:hidden;cursor:pointer;min-height:64px;border:1px solid rgba(180,230,255,0.15)}
.frase-txt{padding:16px 18px;font-style:italic;font-size:clamp(0.9rem,2.8vw,1.05rem);color:rgba(220,240,255,0.92);line-height:1.6;text-align:center;background:rgba(180,230,255,0.05)}
.frase-overlay{position:absolute;inset:0;background:linear-gradient(135deg,#0a1628,#0d1f3a);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;transition:opacity 0.5s ease;cursor:pointer;user-select:none}
.frase-overlay.rev{opacity:0;pointer-events:none}
.frase-lock{font-size:1.4rem}
.frase-hint{font-family:'Nunito',sans-serif;font-weight:700;font-size:0.62rem;letter-spacing:0.22em;color:rgba(180,230,255,0.45);text-transform:uppercase}
.frase-shimmer{position:absolute;top:0;left:-100%;width:60%;height:100%;background:linear-gradient(90deg,transparent,rgba(180,230,255,0.12),transparent);animation:shimmer 2.5s ease-in-out infinite}

/* ══ S4 ÁLBUM ══ */
#s4 .inner{max-width:360px;width:100%;display:flex;flex-direction:column;align-items:center}
.album-portada{width:clamp(260px,80vw,320px);aspect-ratio:3/4;background:linear-gradient(160deg,#2a1a0e,#1a0e06);border-radius:8px 16px 16px 8px;border:2px solid rgba(180,130,60,0.4);box-shadow:-4px 0 0 rgba(120,70,20,0.8),0 12px 40px rgba(0,0,0,0.6),inset 0 0 30px rgba(0,0,0,0.3);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;position:relative;overflow:hidden;animation:fadeUp 0.7s ease both}
.album-portada:active{transform:scale(0.97)}
.album-portada::before{content:'';position:absolute;left:0;top:0;bottom:0;width:18px;background:linear-gradient(90deg,#1a0e06,#3a2010,#1a0e06);border-right:1px solid rgba(180,130,60,0.3)}
.album-titulo{font-family:'Pacifico',cursive;font-size:clamp(1.2rem,4vw,1.6rem);color:#d4a050;text-shadow:0 2px 8px rgba(180,120,20,0.5);margin-bottom:8px;margin-left:14px;text-align:center}
.album-sub{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:0.88rem;color:rgba(200,160,80,0.6);margin-left:14px;margin-bottom:16px}
.album-deco{font-size:2rem;margin-left:14px}
.album-hint{font-family:'Nunito',sans-serif;font-weight:700;font-size:0.62rem;letter-spacing:0.22em;color:rgba(180,130,60,0.5);text-transform:uppercase;margin-top:16px;margin-left:14px;animation:blink 2s ease-in-out infinite}
.album-broche{position:absolute;top:16px;right:16px;font-size:1.5rem;animation:brocheWiggle 3s ease-in-out infinite}
.album-pagina{display:none;width:clamp(260px,80vw,320px);background:linear-gradient(160deg,#f5f0e8,#ede5d0);border-radius:8px 16px 16px 8px;border:1px solid rgba(180,130,60,0.3);box-shadow:-4px 0 0 rgba(120,70,20,0.8),0 12px 40px rgba(0,0,0,0.6);padding:20px 20px 20px 30px;position:relative;animation:paginaAbrir 0.6s cubic-bezier(0.34,1.56,0.64,1) both}
.album-pagina::before{content:'';position:absolute;left:0;top:0;bottom:0;width:20px;background:linear-gradient(90deg,#2a1a0e,#3a2010,#2a1a0e);border-right:1px solid rgba(180,130,60,0.3)}
.album-foto{width:100%;aspect-ratio:3/4;object-fit:cover;object-position:top;border-radius:4px;box-shadow:0 4px 16px rgba(0,0,0,0.3);display:block}
.album-verso{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:0.9rem;color:#5a3a1a;text-align:center;margin-top:10px;line-height:1.5;padding:0 4px}
.album-ref{font-family:'Nunito',sans-serif;font-size:0.62rem;letter-spacing:0.15em;color:rgba(120,80,30,0.45);text-align:center;margin-top:4px;text-transform:uppercase}
.album-cierre{display:none;width:clamp(260px,80vw,320px);aspect-ratio:3/4;background:linear-gradient(160deg,#2a1a0e,#1a0e06);border-radius:8px 16px 16px 8px;border:2px solid rgba(180,130,60,0.4);box-shadow:-4px 0 0 rgba(120,70,20,0.8),0 12px 40px rgba(0,0,0,0.6);padding:32px 24px;text-align:center;flex-direction:column;align-items:center;justify-content:center;animation:paginaAbrir 0.6s ease both}
.cierre-emoji{font-size:2.5rem;animation:floatY 3s ease-in-out infinite}
.cierre-titulo{font-family:'Pacifico',cursive;font-size:clamp(1.1rem,4vw,1.5rem);color:#d4a050;margin-top:12px;text-shadow:0 0 20px rgba(200,150,30,0.5);line-height:1.4}
.album-nav{display:flex;gap:6px;margin-top:16px;justify-content:center}
.album-dot{width:7px;height:7px;border-radius:50%;background:rgba(180,230,255,0.2);transition:background 0.3s}
.album-dot.active{background:var(--sky)}

/* ══ FINAL ══ */
#s5 .inner{max-width:360px;width:100%;display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center}
.final-emoji{font-size:3rem;animation:floatY 3s ease-in-out infinite}
.final-titulo{font-family:'Pacifico',cursive;font-size:clamp(1.5rem,5vw,2.2rem);background:linear-gradient(135deg,#fff,#b8e8ff,#f5d76e);-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1.3}
.final-msg{font-style:italic;font-size:clamp(0.95rem,3vw,1.1rem);color:rgba(200,230,255,0.7);line-height:1.65}
.final-firma{font-family:'Nunito',sans-serif;font-weight:700;font-size:0.75rem;letter-spacing:0.2em;color:rgba(140,200,255,0.35);text-transform:uppercase}

/* ══ KEYFRAMES ══ */
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes glowPulse{from{opacity:0.5;transform:scale(0.97)}to{opacity:1;transform:scale(1.03)}}
@keyframes solSpin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
@keyframes solPulse{0%,100%{text-shadow:0 0 8px rgba(255,220,50,0.9),0 0 20px rgba(255,200,30,0.7),0 0 40px rgba(255,180,0,0.5);transform:scale(1)}50%{text-shadow:0 0 12px rgba(255,230,80,1),0 0 30px rgba(255,210,40,0.9),0 0 60px rgba(255,190,10,0.7);transform:scale(1.06)}}
@keyframes subrayado{0%,100%{opacity:0.5;transform:scaleX(0.8)}50%{opacity:1;transform:scaleX(1)}}
@keyframes shimmer{0%{left:-100%}60%,100%{left:160%}}
@keyframes paginaAbrir{from{opacity:0;transform:perspective(600px) rotateY(-25deg) scale(0.9)}to{opacity:1;transform:perspective(600px) rotateY(0deg) scale(1)}}
@keyframes brocheWiggle{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
@keyframes blink{0%,100%{opacity:0.5}50%{opacity:0.2}}
@keyframes logoPulse{0%,100%{filter:drop-shadow(0 0 8px rgba(0,255,136,0.4))}50%{filter:drop-shadow(0 0 20px rgba(0,255,136,0.9))}}
@keyframes textBlink{0%,100%{opacity:1}50%{opacity:0.3}}
@keyframes cursorBlink{0%,100%{opacity:1}50%{opacity:0}}
@keyframes confFall{0%{transform:translateY(-30px) rotate(0deg);opacity:1}80%{opacity:0.8}100%{transform:translateY(105vh) rotate(var(--rot));opacity:0}}



/* Ocultar canvas de regalito hasta que se use */
#bg{display:none;}
#bgSol{display:none;}

/* ══ JARDÍN 2 MESES — v4 ══ */
#jardinScreen{
  position:fixed;inset:0;z-index:700;
  display:none;flex-direction:column;
  align-items:center;
  background:radial-gradient(ellipse at 50% 20%,#2a0e1e 0%,#150610 55%,#0a0308 100%);
  overflow-y:auto;
  padding:60px 20px 60px;
  opacity:0;transition:opacity 0.7s ease;
}
#jardinScreen.visible{opacity:1;}
#jardinScreen.activo{display:flex;}

#btnVolverJardin{
  position:fixed;top:16px;left:16px;z-index:750;
  font-family:'Nunito',sans-serif;font-weight:700;
  font-size:0.78rem;letter-spacing:0.12em;
  color:rgba(255,200,220,0.7);
  background:none;border:none;cursor:pointer;display:none;
}

.jardin-sub{display:none;flex-direction:column;align-items:center;width:100%;}
.jardin-sub.activo{display:flex;animation:fadeUp 0.6s ease both;}

.jardin-header{text-align:center;margin-bottom:6px;}
.jardin-emoji{font-size:2rem;animation:floatY 3s ease-in-out infinite;}
.jardin-titulo{
  font-family:'Pacifico',cursive;
  font-size:clamp(1.4rem,5.5vw,2.1rem);
  background:linear-gradient(135deg,#ffd4e5,#ff9dc4,#ffb7d5);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  margin:6px 0 4px;
}

@keyframes florSway{
  0%,100%{transform:rotate(-2.4deg) translateY(0)}
  50%{transform:rotate(2.6deg) translateY(-3px)}
}
@keyframes florBloom{
  0%{transform:scale(1)}
  35%{transform:scale(1.12)}
  100%{transform:scale(1)}
}

/* ══ INTRO: 2 FLORES + SUELO ══ */
.jardin-intro-wrap{
  position:relative;
  width:100%;max-width:360px;
  padding-bottom:26px;
  margin:10px 0 16px;
}
.jardin-intro-flores{
  display:flex;gap:0;align-items:flex-end;justify-content:center;
  position:relative;z-index:2;
}
.intro-flor{
  width:150px;height:178px;
  animation:florSway 4.2s ease-in-out infinite;
  transform-origin:50% 90%;
  margin:0 -8px;
}
.intro-flor:nth-child(2){animation-delay:-1.6s;animation-duration:3.8s;}
.intro-flor svg{width:100%;height:100%;display:block;}
.suelo-wrap{
  position:absolute;left:-10%;right:-10%;bottom:0;
  height:44px;z-index:1;
  filter:drop-shadow(0 -2px 8px rgba(0,0,0,0.3));
}
.suelo-svg{width:100%;height:100%;display:block;}

.jardin-intro-msg{
  font-family:'Cormorant Garamond',serif;font-style:italic;
  font-size:clamp(1rem,3.6vw,1.2rem);
  color:rgba(255,225,238,0.88);
  line-height:1.7;text-align:center;
  max-width:320px;margin-bottom:26px;
  text-shadow:0 0 20px rgba(255,150,190,0.25);
}

/* ══ SECUENCIA ══ */
.jardin-progreso{
  font-family:'Nunito',sans-serif;font-weight:700;
  font-size:0.7rem;letter-spacing:0.22em;
  color:rgba(255,180,210,0.5);text-transform:uppercase;
  margin-bottom:18px;
}
.flor-central-wrap{
  width:230px;height:260px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;position:relative;
  margin-bottom:6px;
}
.flor-central{
  width:100%;height:100%;
  animation:florSway 4s ease-in-out infinite;
  transform-origin:50% 88%;
}
.flor-central.bloom{animation:florBloom 0.55s ease;}
.flor-central svg{width:100%;height:100%;display:block;}
.flor-tap-hint{
  position:absolute;bottom:2px;left:50%;transform:translateX(-50%);
  font-family:'Nunito',sans-serif;font-weight:700;
  font-size:0.62rem;letter-spacing:0.2em;
  color:rgba(255,200,220,0.4);text-transform:uppercase;
  animation:blink 2s ease-in-out infinite;
  white-space:nowrap;
}
.jardin-msg-actual{
  font-family:'Cormorant Garamond',serif;font-style:italic;
  font-size:clamp(1.05rem,3.8vw,1.3rem);
  color:#ffe8f0;line-height:1.65;text-align:center;
  max-width:320px;min-height:1.5em;
  text-shadow:0 0 20px rgba(255,150,190,0.3);
  opacity:0;transform:translateY(10px);
  transition:opacity 0.6s ease,transform 0.6s ease;
  margin:14px 0 8px;
}
.jardin-msg-actual.visible{opacity:1;transform:translateY(0);}

/* ══ FINAL ══ */
.jardin-final-emoji{font-size:2.6rem;margin-bottom:10px;animation:floatY 3s ease-in-out infinite;}
.jardin-final-titulo{
  font-family:'Pacifico',cursive;
  font-size:clamp(1.3rem,5vw,1.8rem);
  background:linear-gradient(135deg,#ffd4e5,#ff9dc4);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  margin-bottom:10px;
}
.jardin-final-msg{
  font-family:'Cormorant Garamond',serif;font-style:italic;
  font-size:1rem;color:rgba(255,220,235,0.8);
  max-width:300px;line-height:1.6;text-align:center;
}

#bgSol{display:none;}

(function(){
  var c=document.getElementById('bg');
  var bx=c.getContext('2d');
  function resz(){c.width=innerWidth;c.height=innerHeight;}
  resz();window.addEventListener('resize',resz);
  var PART=[];
  for(var i=0;i<130;i++){
    PART.push({x:Math.random(),y:Math.random(),r:Math.random()*1.2+0.2,
      a:Math.random()*0.5+0.15,sp:0.002+Math.random()*0.006,
      ph:Math.random()*Math.PI*2,hue:330+Math.random()*30});
  }
  function draw(t){
    bx.clearRect(0,0,c.width,c.height);
    var g=bx.createRadialGradient(c.width/2,c.height*0.3,0,c.width/2,c.height/2,c.width*0.9);
    g.addColorStop(0,'#2a0e1e');g.addColorStop(0.5,'#150610');g.addColorStop(1,'#0a0308');
    bx.fillStyle=g;bx.fillRect(0,0,c.width,c.height);
    PART.forEach(function(p){
      var a=p.a*(0.3+0.7*Math.sin(t*0.001*p.sp*400+p.ph));
      bx.beginPath();bx.arc(p.x*c.width,p.y*c.height,p.r,0,Math.PI*2);
      bx.fillStyle='hsla('+p.hue+',80%,75%,'+a+')';bx.fill();
    });
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
})();

/* ══ CONFETTI (standalone) ══ */
function spawnConfetti(n){
  var CONF=['💙','🌸','✨','💕'];
  for(var i=0;i<n;i++){
    (function(ii){
      setTimeout(function(){
        var c=document.createElement('div');
        c.style.cssText='position:fixed;top:-30px;pointer-events:none;z-index:999;font-size:'+(0.9+Math.random()*0.8)+'rem;left:'+Math.random()*100+'%;transition:all 2.5s linear;';
        c.textContent=CONF[Math.floor(Math.random()*CONF.length)];
        document.body.appendChild(c);
        requestAnimationFrame(function(){c.style.top='105vh';c.style.transform='rotate('+(Math.random()*720-360)+'deg)';c.style.opacity='0';});
        setTimeout(function(){c.remove();},2600);
      },ii*80);
    })(i);
  }
}

var jardinIdx=0;
var jardinRevelado=false;

/* irAlJardin ya no hace falta — la página arranca directo en el jardín */

function resetJardin(){
  jardinIdx=0;
  jardinRevelado=false;
  document.querySelectorAll('.jardin-sub').forEach(function(s){s.classList.remove('activo');});
  document.getElementById('jardinIntro').classList.add('activo');
}

function switchJardinSub(id){
  document.querySelectorAll('.jardin-sub').forEach(function(s){s.classList.remove('activo');});
  document.getElementById(id).classList.add('activo');
}

function iniciarSecuenciaJardin(){
  switchJardinSub('jardinSecuencia');
  jardinIdx=0;
  mostrarFlorSecuencia(0);
}

function mostrarFlorSecuencia(i){
  jardinRevelado=false;
  document.getElementById('jardinProgreso').textContent=(i+1)+' / 12';
  document.getElementById('florCentral').innerHTML=FLOR_SVGS_JARDIN[i];
  var msg=document.getElementById('jardinMsgActual');
  msg.textContent='';
  msg.classList.remove('visible');
  document.getElementById('florTapHint').style.display='block';
  document.getElementById('btnSiguienteFlor').style.display='none';
}

function revelarMensajeActual(){
  if(jardinRevelado) return;
  jardinRevelado=true;
  document.getElementById('florTapHint').style.display='none';

  var flor=document.getElementById('florCentral');
  flor.classList.add('bloom');
  setTimeout(function(){flor.classList.remove('bloom');},560);

  var msg=document.getElementById('jardinMsgActual');
  msg.textContent=MENSAJES_JARDIN[jardinIdx];
  requestAnimationFrame(function(){
    requestAnimationFrame(function(){msg.classList.add('visible');});
  });

  if(typeof spawnConfetti==='function') spawnConfetti(6);

  setTimeout(function(){
    document.getElementById('btnSiguienteFlor').style.display='block';
  },450);
}

function siguienteFlor(){
  jardinIdx++;
  if(jardinIdx>=12){
    switchJardinSub('jardinFinal');
    if(typeof spawnConfetti==='function') spawnConfetti(24);
    return;
  }
  mostrarFlorSecuencia(jardinIdx);
}

/* volverDesdeJardin ya no hace falta — el link "← Menú" va directo a index.html */





/* ══ AUTOINICIO (standalone) ══ */
resetJardin();
document.getElementById('jardinScreen').classList.add('activo');
requestAnimationFrame(function(){
  requestAnimationFrame(function(){
    document.getElementById('jardinScreen').classList.add('visible');
  });
});

</script>
