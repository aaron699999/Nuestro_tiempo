<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Nuestro tiempo juntos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=DM+Mono:wght@500&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#1A0B2E;
    --pink:#FF2E87;
    --orange:#FF6B35;
    --purple:#7B2FF7;
    --gold:#FFD23F;
    --mint:#00E0B8;
    --white:#FFFFFF;
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--bg-deep);
    color:var(--white);
    font-family:'Inter',sans-serif;
    overflow-x:hidden;
    position:relative;
  }

  .aurora{
    position:fixed;
    inset:0;
    z-index:-1;
    background:
      radial-gradient(circle at 20% 30%, var(--pink) 0%, transparent 45%),
      radial-gradient(circle at 80% 20%, var(--purple) 0%, transparent 45%),
      radial-gradient(circle at 50% 85%, var(--orange) 0%, transparent 45%),
      radial-gradient(circle at 5% 90%, var(--gold) 0%, transparent 40%);
    filter:blur(80px) saturate(150%);
    opacity:0.55;
    animation:auroraMove 28s ease-in-out infinite alternate;
  }

  @keyframes auroraMove{
    0%{transform:scale(1) rotate(0deg);}
    50%{transform:scale(1.15) rotate(8deg);}
    100%{transform:scale(1) rotate(-6deg);}
  }

  .heart{
    position:fixed;
    bottom:-10%;
    font-size:1.1rem;
    opacity:0.45;
    pointer-events:none;
    animation:floatUp linear infinite;
    z-index:0;
  }

  @keyframes floatUp{
    0%{transform:translateY(0) translateX(0); opacity:0;}
    10%{opacity:0.45;}
    90%{opacity:0.3;}
    100%{transform:translateY(-115vh) translateX(20px); opacity:0;}
  }

  .hidden{display:none !important;}

  .card{
    position:relative;
    z-index:1;
    background:rgba(255,255,255,0.06);
    backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,0.14);
    border-radius:24px;
    padding:2.5rem 2rem;
    width:90%;
    max-width:380px;
    text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,0.35);
  }

  .card h1{
    font-family:'Fredoka',sans-serif;
    font-weight:700;
    font-size:clamp(1.4rem,5vw,1.9rem);
    margin:0 0 0.4rem;
  }

  .card p.sub{
    margin:0 0 1.8rem;
    opacity:0.75;
    font-size:0.92rem;
  }

  label{
    display:block;
    text-align:left;
    font-size:0.78rem;
    letter-spacing:0.5px;
    text-transform:uppercase;
    opacity:0.7;
    margin:0 0 0.35rem;
  }

  input{
    width:100%;
    padding:0.85rem 1rem;
    margin-bottom:1.1rem;
    border-radius:12px;
    border:1px solid rgba(255,255,255,0.18);
    background:rgba(255,255,255,0.08);
    color:var(--white);
    font-family:'Inter',sans-serif;
    font-size:1rem;
  }

  input::placeholder{color:rgba(255,255,255,0.4);}

  input:focus-visible, button:focus-visible{
    outline:2px solid var(--gold);
    outline-offset:2px;
  }

  button{
    width:100%;
    padding:0.95rem;
    border:none;
    border-radius:14px;
    background:linear-gradient(135deg, var(--pink), var(--purple));
    color:var(--white);
    font-family:'Inter',sans-serif;
    font-weight:700;
    font-size:1rem;
    letter-spacing:0.3px;
    cursor:pointer;
    transition:transform 0.15s ease;
  }

  button:hover{transform:scale(1.02);}
  button:active{transform:scale(0.97);}

  .error{
    color:var(--gold);
    font-size:0.85rem;
    margin-top:0.9rem;
    min-height:1.2em;
  }

  #counter-screen{
    position:relative;
    z-index:1;
    text-align:center;
    padding:1.5rem;
  }

  #counter-screen h1{
    font-family:'Fredoka',sans-serif;
    font-weight:700;
    font-size:clamp(1.8rem,6vw,2.8rem);
    margin:0 0 2.2rem;
    background:linear-gradient(90deg, var(--pink), var(--orange), var(--gold), var(--purple), var(--pink));
    background-size:300% auto;
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    animation:gradientShift 9s linear infinite;
  }

  @keyframes gradientShift{
    0%{background-position:0% 50%;}
    100%{background-position:300% 50%;}
  }

  .digits{
    display:flex;
    gap:clamp(0.6rem,3vw,2rem);
    justify-content:center;
    flex-wrap:wrap;
  }

  .unit{
    display:flex;
    flex-direction:column;
    align-items:center;
    min-width:70px;
  }

  .unit .value{
    font-family:'DM Mono',monospace;
    font-weight:500;
    font-size:clamp(2rem,9vw,4rem);
    line-height:1;
  }

  .unit.dias .value{color:var(--pink); text-shadow:0 0 25px rgba(255,46,135,0.55);}
  .unit.horas .value{color:var(--orange); text-shadow:0 0 25px rgba(255,107,53,0.55);}
  .unit.min .value{color:var(--purple); text-shadow:0 0 25px rgba(123,47,247,0.6);}
  .unit.seg .value{color:var(--gold); text-shadow:0 0 25px rgba(255,210,63,0.55);}

  .unit .label{
    font-family:'Inter',sans-serif;
    font-size:0.7rem;
    letter-spacing:2px;
    text-transform:uppercase;
    opacity:0.65;
    margin-top:0.5rem;
  }

  .since{
    margin-top:2.2rem;
    font-size:0.92rem;
    opacity:0.75;
  }

  .cancion{
    margin-top:2.5rem;
    max-width:360px;
    width:90%;
  }

  .dedicatoria{
    font-family:"Inter",sans-serif;
    font-size:clamp(0.95rem,3.5vw,1.1rem);
    line-height:1.8;
    color:rgba(255,255,255,0.88);
    text-align:center;
    margin:0 0 1.5rem;
    font-style:italic;
  }

  .gracias{
    font-family:"Fredoka",sans-serif;
    font-size:clamp(1.1rem,4vw,1.35rem);
    font-style:normal;
    font-weight:700;
    background:linear-gradient(90deg, var(--pink), var(--orange));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }

  @media (prefers-reduced-motion: reduce){
    .aurora, .heart, #counter-screen h1{animation:none !important;}
  }
</style>
</head>
<body>

<div class="aurora"></div>
<span class="heart" style="left:8%; animation-duration:14s; animation-delay:0s;">&#10084;</span>
<span class="heart" style="left:25%; animation-duration:18s; animation-delay:3s;">&#10084;</span>
<span class="heart" style="left:50%; animation-duration:16s; animation-delay:1s;">&#10084;</span>
<span class="heart" style="left:70%; animation-duration:20s; animation-delay:5s;">&#10084;</span>
<span class="heart" style="left:88%; animation-duration:15s; animation-delay:2s;">&#10084;</span>

<div id="login-screen" class="card">
  <h1>&#191;Lista para empezar a contar?</h1>
  <p class="sub">Ingres&aacute; tu usuario y contrase&ntilde;a.</p>
  <div id="login-form">
    <label for="usuario">Usuario</label>
    <input id="usuario" type="text" autocomplete="username" placeholder="usuario">
    <label for="contrasena">Contrase&ntilde;a</label>
    <input id="contrasena" type="password" autocomplete="current-password" placeholder="contraseña">
    <button id="btn-entrar">Entrar</button>
    <p class="error" id="error-msg" role="alert"></p>
  </div>
</div>

<div id="counter-screen" class="hidden">
  <h1>Nuestro tiempo juntos</h1>
  <div class="digits">
    <div class="unit dias"><span class="value" id="v-dias">0</span><span class="label">D&iacute;as</span></div>
    <div class="unit horas"><span class="value" id="v-horas">00</span><span class="label">Horas</span></div>
    <div class="unit min"><span class="value" id="v-min">00</span><span class="label">Min</span></div>
    <div class="unit seg"><span class="value" id="v-seg">00</span><span class="label">Seg</span></div>
  </div>
  <p class="since" id="desde"></p>

  <div class="cancion">
    <p class="dedicatoria">
      Esta canci&oacute;n me recuerda a ti,<br>
      porque as&iacute; como dice esta canci&oacute;n,<br>
      llegaste y le diste luz<br>
      a mis d&iacute;as grises.&nbsp;&#9825;<br><br>
      <span class="gracias">Gracias por existir.</span>
    </p>
    <iframe
      src="https://open.spotify.com/embed/track/7oTeTdhsppTQ4uk11cdDwe?utm_source=generator&theme=0"
      width="100%"
      height="152"
      frameborder="0"
      allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
      loading="lazy"
      style="border-radius:14px; margin-top:0.5rem;">
    </iframe>
  </div>
</div>

<script>
  var USUARIO = "ximena0410";
  var CONTRASENA = "migordito";

  // Fecha de inicio fija — 20 de junio de 2026 a las 22:11:06 (Bolivia UTC-4)
  var FECHA_INICIO = new Date("2026-06-20T22:11:06-04:00");

  var loginScreen = document.getElementById("login-screen");
  var counterScreen = document.getElementById("counter-screen");
  var errorMsg = document.getElementById("error-msg");
  var desdeEl = document.getElementById("desde");

  var vDias = document.getElementById("v-dias");
  var vHoras = document.getElementById("v-horas");
  var vMin = document.getElementById("v-min");
  var vSeg = document.getElementById("v-seg");

  function pad(n){ return String(n).padStart(2, "0"); }

  function formatearFecha(fecha){
    return fecha.toLocaleString("es-ES", {
      day:"numeric", month:"long", year:"numeric",
      hour:"2-digit", minute:"2-digit"
    });
  }

  function actualizarDigitos(){
    var diffMs = Date.now() - FECHA_INICIO.getTime();
    var totalSeg = Math.max(0, Math.floor(diffMs / 1000));
    var dias  = Math.floor(totalSeg / 86400);
    var horas = Math.floor((totalSeg % 86400) / 3600);
    var min   = Math.floor((totalSeg % 3600) / 60);
    var seg   = totalSeg % 60;
    vDias.textContent  = dias;
    vHoras.textContent = pad(horas);
    vMin.textContent   = pad(min);
    vSeg.textContent   = pad(seg);
  }

  function mostrarContador(){
    loginScreen.classList.add("hidden");
    counterScreen.classList.remove("hidden");
    desdeEl.textContent = "Desde el " + formatearFecha(FECHA_INICIO);
    actualizarDigitos();
    setInterval(actualizarDigitos, 1000);
  }

  document.getElementById("btn-entrar").addEventListener("click", function(){
    errorMsg.textContent = "";
    var usuario   = document.getElementById("usuario").value.trim();
    var contrasena = document.getElementById("contrasena").value;

    if(usuario !== USUARIO || contrasena !== CONTRASENA){
      errorMsg.textContent = "Usuario o contrase\u00f1a incorrectos.";
      return;
    }
    mostrarContador();
  });

  // Permitir Enter en los inputs
  document.getElementById("contrasena").addEventListener("keydown", function(e){
    if(e.key === "Enter"){ document.getElementById("btn-entrar").click(); }
  });
  document.getElementById("usuario").addEventListener("keydown", function(e){
    if(e.key === "Enter"){ document.getElementById("contrasena").focus(); }
  });
</script>

</body>
</html>
